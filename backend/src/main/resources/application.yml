server:
  port: 8080
  servlet:
    session:
      timeout: 7d
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qzone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:qzone}
    password: ${SPRING_DATASOURCE_PASSWORD:qzone123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  session:
    redis:
      namespace: qzone:session
  cache:
    type: redis
    redis:
      time-to-live: 60s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
